<!doctype html>
<html lang="uk">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AutoSale UA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <img class="approved-design" src="autosale-home.png" alt="AutoSale UA">

    <!-- Transparent interaction zones over the approved visual design -->

    <button class="hotspot rent" aria-label="Орендувати авто"></button>

  <script src="app.js"></script>
