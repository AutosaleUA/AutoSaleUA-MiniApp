<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <title>AutoSale UA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-label="AutoSale UA">
    <div class="hero">
      <img src="autosale-home.png" alt="" class="scene" width="1536" height="483">
    </div>
    <div class="actions-panel">
      <button class="action action-buy" data-section="buy" aria-label="Купити авто">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 16.5V12l1.6-4.5A2 2 0 0 1 7.5 6h9a2 2 0 0 1 1.9 1.5L20 12v4.5" stroke="#2c4570" stroke-width="1.7" stroke-linejoin="round"/><rect x="3" y="16" width="18" height="3.2" rx="1.4" fill="#2c4570"/><circle cx="7.5" cy="19.2" r="1.5" fill="#2c4570"/><circle cx="16.5" cy="19.2" r="1.5" fill="#2c4570"/></svg></span>
        <span class="copy"><strong>Купити авто</strong><small>Оголошення про продаж</small></span>
        <span class="badge">🔥&nbsp; Найбільший вибір</span><span class="arrow">›</span>
      </button>

      <button class="action action-rent" data-section="rent" aria-label="Орендувати авто">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5.5" width="16" height="14.5" rx="2" stroke="#385c44" stroke-width="1.7"/><path d="M4 10h16M8 3.5v3M16 3.5v3" stroke="#385c44" stroke-width="1.7" stroke-linecap="round"/><path d="M9 14l2 2 4-4" stroke="#385c44" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="copy"><strong>Орендувати авто</strong><small>Авто, доступні для оренди</small></span>
        <span class="badge">💰&nbsp; Вигідні ціни</span><span class="arrow">›</span>
      </button>

      <button class="action action-sell" data-section="sell" aria-label="Продати авто">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M11.3 3.7 20 12.4a2 2 0 0 1 0 2.8l-4.8 4.8a2 2 0 0 1-2.8 0L3.7 11.3A2 2 0 0 1 3.1 10V5a2 2 0 0 1 2-2h5a2 2 0 0 1 1.4.6Z" stroke="#96602f" stroke-width="1.7" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.4" fill="#96602f"/></svg></span>
        <span class="copy"><strong>Продати авто</strong><small>Розмістити оголошення</small></span>
        <span class="badge">⚡&nbsp; Швидко і зручно</span><span class="arrow">›</span>
      </button>

      <button class="action action-give-rent" data-section="give-rent" aria-label="Здати авто в оренду">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="15" r="3" stroke="#4a3d70" stroke-width="1.7"/><path d="M10.1 12.9 18 5" stroke="#4a3d70" stroke-width="1.7" stroke-linecap="round"/><path d="M14.5 9.4l2 2M17 6.9l2 2" stroke="#4a3d70" stroke-width="1.7" stroke-linecap="round"/><path d="M15.5 3.5H20.5V8.5" stroke="#4a3d70" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="copy"><strong>Здати авто в оренду</strong><small>Розмістити оголошення</small></span>
        <span class="badge">📈&nbsp; Дохід з авто</span><span class="arrow">›</span>
      </button>

      <button class="action action-insurance" data-section="insurance" aria-label="Страхування авто">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3Z" stroke="#345c66" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2.2 2.2L15.5 9.5" stroke="#345c66" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="copy"><strong>Страхування авто</strong><small>Отримати найвигіднішу ціну</small></span>
        <span class="badge">🛡️&nbsp; Вигідні умови</span><span class="arrow">›</span>
      </button>

      <div class="benefits" aria-label="Переваги">
        <div>🛡️ <span>Надійно</span></div>
        <div>⏱️ <span>Швидко</span></div>
        <div>♡ <span>Зручно в Telegram</span></div>
      </div>

      <div class="footer">AutoSale UA · Оголошення від власників</div>
    </div>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
