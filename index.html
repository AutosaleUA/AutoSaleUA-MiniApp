<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AutoSale UA</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <div class="logo">A</div>
        <div>
          <div class="brand-name">AutoSale <span>UA</span></div>
          <div class="tagline">Оголошення від власників</div>
        </div>
      </div>
    </header>

    <section class="actions" aria-label="Основні розділи">
      <button class="action buy" data-action="buy">
        <strong>Купити авто</strong>
        <span>Переглянути оголошення</span>
      </button>

      <button class="action rent" data-action="rent">
        <strong>Орендувати авто</strong>
        <span>Знайти авто в оренду</span>
      </button>

      <button class="action sell" data-action="sell">
        <strong>Продати авто</strong>
        <span>Розмістити оголошення</span>
      </button>

      <button class="action give-rent" data-action="give-rent">
        <strong>Здати авто в оренду</strong>
        <span>Розмістити авто в оренду</span>
      </button>

      <button class="action insurance" data-action="insurance">
        <strong>Страхування авто</strong>
        <span>Отримати пропозицію</span>
      </button>
    </section>

    <section class="benefits">
      <div><b>✓</b><span>Надійно</span></div>
      <div><b>⚡</b><span>Швидко</span></div>
      <div><b>●</b><span>Зручно в Telegram</span></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
